<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>VybavTo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <aside id="mobile-sidebar">
            <h1>VybavTo</h1>
            <nav>
                <ul>
                    <li><a href="index.html" class="active" aria-current="page">Dashboard</a></li>
                    <li><a href="">Moje úlohy</a></li>
                    <li><a href="">Projekty</a></li>
                </ul>
            </nav>
            <section>
                <button>+ Nový projekt</button>
                <h2>Moje projekty</h2>
                <ul>
                    <li><a href="project.html">VAII</a></li>
                    <li><a href="">MaS</a></li>
                    <li><a href="">POS</a></li>
                </ul>
            </section>
        </aside>
        <header>
            <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-label="Otvoriť navigáciu"
                    aria-controls="mobile-sidebar">
                ☰
            </button>
            <button type="button" class="user-menu-toggle">
                <span class="avatar"></span>
                <span class="user-name">Michal Miartuš</span>
                <span class="user-menu-arrow">▼</span>
            </button>
        </header>
        <main>
            <div class="dashboard-content">
                <h2>Dashboard</h2>

                <section class="dashboard-stats" aria-label="Moje štatistiky">
                    <article class="stat-card">
                        <h3>Moje aktívne úlohy</h3>
                        <div class="stat-card-bottom">
                            <p class="stat-value">2</p>
                            <img src="icons/list-todo.svg" alt="" class="stat-icon">
                        </div>
                    </article>

                    <article class="stat-card">
                        <h3>Moje rozpracované úlohy</h3>
                        <div class="stat-card-bottom">
                            <p class="stat-value">1</p>
                            <img src="icons/clock-3.svg" alt="" class="stat-icon">
                        </div>
                    </article>

                    <article class="stat-card">
                        <h3>Moje dokončené úlohy</h3>
                        <div class="stat-card-bottom">
                            <p class="stat-value">1</p>
                            <img src="icons/check-check.svg" alt="" class="stat-icon">
                        </div>
                    </article>

                    <article class="stat-card">
                        <h3>Dokončené projekty</h3>
                        <div class="stat-card-bottom">
                            <p class="stat-value">0</p>
                            <img src="icons/folder-check.svg" alt="" class="stat-icon">
                        </div>
                    </article>
                </section>

                <section class="dashboard-projects">
                    <h3>Moje projekty</h3>

                    <div class="projects-grid">
                        <article class="project-card">
                            <div class="project-card-header">
                                <div class="project-card-info">
                                    <h4>VAII semestrálka</h4>
                                    <p>Tímový projekt</p>
                                </div>
                                <span class="project-status">Aktívny</span>
                            </div>
                            <div class="project-progress">
                                <div class="project-progress-header">
                                    <label for="vaii-progres">3 z 10 úloh dokončených</label>
                                    <span>30%</span>
                                </div>
                                <progress id="vaii-progres" value="3" max="10">30%</progress>
                            </div>
                            <a href="project.html" class="project-card-link">
                                Otvoriť projekt
                            </a>
                        </article>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
